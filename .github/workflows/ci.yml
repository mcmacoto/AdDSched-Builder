name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  django-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django checks
        env:
          SECRET_KEY: ci-temporary-secret-key
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
          GEMINI_API_KEY: ci-dummy-key
        run: |
          python manage.py check

      - name: Static collection smoke test
        env:
          SECRET_KEY: ci-temporary-secret-key
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
          GEMINI_API_KEY: ci-dummy-key
        run: |
          python manage.py collectstatic --noinput --clear

      - name: Compile Python modules
        run: |
          python -m compileall addsched core
